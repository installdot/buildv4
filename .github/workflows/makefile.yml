name: Build iOS Tweak

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile TempMailTrace.dylib
        run: sh build.sh

      - name: Upload the dylib
        uses: actions/upload-artifact@v6
        with:
          name: TempMailTrace-dylib
          path: build/TempMailTrace.dylib
          if-no-files-found: error
